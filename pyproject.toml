[project]
name = "pulse-analytics"
version = "0.1.0"
description = "Real-time product analytics platform: FastAPI, Kafka, ClickHouse, PostgreSQL, Kubernetes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiokafka[lz4]>=0.11",
    "clickhouse-connect[async]>=0.8",
    "lz4>=4.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "orjson>=3.10",
]

[project.scripts]
pulse = "pulse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[clickhouse,postgres]>=4.7",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "PT"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["pulse"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "clickhouse_connect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
markers = [
    "integration: tests that start real infrastructure via testcontainers",
    "e2e: black-box tests against a running docker-compose stack",
]
addopts = "-m 'not integration and not e2e'"
