x-pulse: &pulse
  image: pulse:local
  build: .
  restart: unless-stopped
  environment: &pulse-env
    PULSE_LOG_JSON: "false"
    PULSE_ADMIN_TOKEN: dev-admin-token
    PULSE_KAFKA__BOOTSTRAP_SERVERS: kafka:9092
    PULSE_CLICKHOUSE__HOST: clickhouse
    PULSE_CLICKHOUSE__USER: pulse
    PULSE_CLICKHOUSE__PASSWORD: pulse
    PULSE_POSTGRES__DSN: postgresql+asyncpg://pulse:pulse@postgres:5432/pulse
    PULSE_WRITER__FLUSH_INTERVAL_SECONDS: "0.5"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
    interval: 3s
    timeout: 3s
    retries: 30
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_USER: pulse
      CLICKHOUSE_PASSWORD: pulse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: wget -qO- http://127.0.0.1:8123/ping || exit 1
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports: ["5432:5432"]
    healthcheck:
      test: pg_isready -U pulse
      interval: 5s
      retries: 20

  migrate:
    image: pulse:local
    build: .
    command: [migrate, all]
    environment: *pulse-env
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}

  ingest-api:
    <<: *pulse
    command: [ingest-api]
    ports: ["8001:8000"]

  analytics-api:
    <<: *pulse
    command: [analytics-api]
    ports: ["8002:8000"]

  admin-api:
    <<: *pulse
    command: [admin-api]
    ports: ["8003:8000"]

  writer:
    <<: *pulse
    command: [writer]

  outbox-relay:
    <<: *pulse
    command: [outbox-relay]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
