# Local cluster (kind): in-cluster Kafka/ClickHouse/Postgres, single replicas, KEDA enabled.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pulse
resources:
  - namespace.yaml
  - ../../base
  - infra/kafka.yaml
  - infra/clickhouse.yaml
  - infra/postgres.yaml
components:
  - ../../components/keda
images:
  - name: pulse
    newName: pulse
    newTag: local
secretGenerator:
  - name: pulse-secrets
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
    literals:
      - PULSE_ADMIN_TOKEN=dev-admin-token
      - PULSE_CLICKHOUSE__PASSWORD=pulse
      - PULSE_POSTGRES__DSN=postgresql+asyncpg://pulse:pulse@postgres:5432/pulse
      - POSTGRES_PASSWORD=pulse
configMapGenerator:
  - name: pulse-config
    behavior: merge
    literals:
      - PULSE_KAFKA__EVENTS_PARTITIONS=6
patches:
  - target: {kind: Deployment}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: HorizontalPodAutoscaler}
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: {kind: Deployment, name: writer|outbox-relay|ingest-api|analytics-api|admin-api}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 20m
