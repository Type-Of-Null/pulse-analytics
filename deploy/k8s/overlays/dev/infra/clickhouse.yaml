apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector: {app.kubernetes.io/name: clickhouse}
  ports: [{name: http, port: 8123}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: clickhouse}
  template:
    metadata:
      labels: {app.kubernetes.io/name: clickhouse, app.kubernetes.io/component: infra}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8-alpine
          ports: [{containerPort: 8123}]
          env:
            - {name: CLICKHOUSE_USER, value: pulse}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: pulse-secrets, key: PULSE_CLICKHOUSE__PASSWORD}}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
          readinessProbe:
            httpGet: {path: /ping, port: 8123}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1536Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/clickhouse}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
