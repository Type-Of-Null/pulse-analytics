# Only the public APIs accept traffic from outside the namespace; workers accept probes/scrapes only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workers-no-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: worker}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{port: 8000}]
