# Scale the writer on Kafka consumer-group lag instead of CPU: lag is what users feel as
# "data freshness". maxReplicaCount = partition count, extra consumers would sit idle.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: writer
spec:
  scaleTargetRef:
    name: writer
  minReplicaCount: 1
  maxReplicaCount: 12
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.pulse.svc.cluster.local:9092  # KEDA operator lives in its own namespace
        consumerGroup: pulse-writer
        topic: events.raw
        lagThreshold: "20000"
        activationLagThreshold: "1000"
        offsetResetPolicy: earliest
